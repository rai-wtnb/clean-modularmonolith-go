version: "2"

run:
  timeout: 5m

linters:
  enable:
    - depguard
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign

  settings:
    depguard:
      rules:
        # ---------------------------------------------------------------------------
        # Cross-module isolation — application & infrastructure layers
        #
        # A module's application/infrastructure layers are NEVER importable by another
        # module. This holds for every file in the importing module, event handlers
        # included. When adding a new module, add a corresponding pair of rules.
        # ---------------------------------------------------------------------------

        orders-no-users-appinfra:
          files:
            - "**/modules/orders/**/*.go"
          deny:
            - pkg: "github.com/rai/clean-modularmonolith-go/modules/users/application"
              desc: "Cross-module application import forbidden."
            - pkg: "github.com/rai/clean-modularmonolith-go/modules/users/infrastructure"
              desc: "Cross-module infrastructure import forbidden."

        users-no-orders-appinfra:
          files:
            - "**/modules/users/**/*.go"
          deny:
            - pkg: "github.com/rai/clean-modularmonolith-go/modules/orders/application"
              desc: "Cross-module application import forbidden."
            - pkg: "github.com/rai/clean-modularmonolith-go/modules/orders/infrastructure"
              desc: "Cross-module infrastructure import forbidden."

        notifications-no-appinfra:
          files:
            - "**/modules/notifications/**/*.go"
          deny:
            - pkg: "github.com/rai/clean-modularmonolith-go/modules/users/application"
              desc: "Cross-module application import forbidden."
            - pkg: "github.com/rai/clean-modularmonolith-go/modules/users/infrastructure"
              desc: "Cross-module infrastructure import forbidden."
            - pkg: "github.com/rai/clean-modularmonolith-go/modules/orders/application"
              desc: "Cross-module application import forbidden."
            - pkg: "github.com/rai/clean-modularmonolith-go/modules/orders/infrastructure"
              desc: "Cross-module infrastructure import forbidden."

        # ---------------------------------------------------------------------------
        # Cross-module isolation — domain layer (domain-event placement ADR)
        #
        # DomainEvent types live in the publishing module's `domain` package. Per the
        # ADR, ONLY another module's event handlers (application/eventhandlers/) may
        # import that `domain` package, and only to reference DomainEvent types.
        #
        # depguard works at package granularity: these rules permit event handlers to
        # import the foreign `domain` package and forbid it everywhere else. The
        # "DomainEvent type only — never entities, value objects or repositories"
        # restriction is a convention reviewers uphold; depguard cannot scope to
        # individual symbols.
        # ---------------------------------------------------------------------------

        orders-no-users-domain:
          files:
            - "**/modules/orders/**/*.go"
            - "!**/modules/orders/application/eventhandlers/**"
          deny:
            - pkg: "github.com/rai/clean-modularmonolith-go/modules/users/domain"
              desc: "Cross-module domain import is allowed only in application/eventhandlers/, and only for DomainEvent types (domain-event placement ADR)."

        users-no-orders-domain:
          files:
            - "**/modules/users/**/*.go"
            - "!**/modules/users/application/eventhandlers/**"
          deny:
            - pkg: "github.com/rai/clean-modularmonolith-go/modules/orders/domain"
              desc: "Cross-module domain import is allowed only in application/eventhandlers/, and only for DomainEvent types (domain-event placement ADR)."

        notifications-no-domain:
          files:
            - "**/modules/notifications/**/*.go"
            - "!**/modules/notifications/application/eventhandlers/**"
          deny:
            - pkg: "github.com/rai/clean-modularmonolith-go/modules/users/domain"
              desc: "Cross-module domain import is allowed only in application/eventhandlers/, and only for DomainEvent types (domain-event placement ADR)."
            - pkg: "github.com/rai/clean-modularmonolith-go/modules/orders/domain"
              desc: "Cross-module domain import is allowed only in application/eventhandlers/, and only for DomainEvent types (domain-event placement ADR)."

        # ---------------------------------------------------------------------------
        # Domain purity — no upward dependencies
        # ---------------------------------------------------------------------------

        domain-purity:
          files:
            - "**/domain/**/*.go"
          deny:
            - pkg: "github.com/rai/clean-modularmonolith-go/modules/*/application"
              desc: "Domain layer cannot import application layer (dependency rule violation)."
            - pkg: "github.com/rai/clean-modularmonolith-go/modules/*/infrastructure"
              desc: "Domain layer cannot import infrastructure layer (dependency rule violation)."
            - pkg: "github.com/rai/clean-modularmonolith-go/internal/platform"
              desc: "Domain layer cannot import platform/infrastructure code."

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
